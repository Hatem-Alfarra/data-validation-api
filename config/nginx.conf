upstream app {
    # Gunicorn binds to this address (defined in gunicorn.conf.py)
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name example.com;  # Replace with actual domain in production

    location / {
        proxy_pass http://app;

        # Pass the real client information to the application
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}